[project]
name = "Ambasada_za_urbanizam"
version = "1.0.0"
description = "Бекэнд для веб-сайта проекта"
requires-python = ">=3.12"
dynamic = ["dependencies", "classifiers"]
authors = []
readme = "README.md"

[tool.poetry]
package-mode = false
classifiers = [
  "Private :: Do not Upload",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# Core Bot Dependencies
aiogram = "^3.21.0"
aiohttp = "^3.9.0"
httpx = "^0.28.1"

# Configuration
python-dotenv = "^1.0.0"

# Storage and Caching
redis = "^5.0.0"
django = "^6.0"
djangorestframework = "^3.16.1"
python-decouple = "^3.8"
django-filter = "^25.2"
pyyaml = "^6.0.3"
drf-spectacular = "^0.29.0"
django-cors-headers = "^4.9.0"
django-csp = "^3.8"
django-extensions = "^4.1"
config = "^0.5.1"
django-redis = "^5.4.0"
dotenv-linter = "^0.7.0"
gunicorn = "^23.0.0"
yamllint = "^1.37.1"
psycopg2 = "^2.9.11"
django-modeltranslation = "^0.20.2"
python-magic = "^0.4.27"
Pillow = "^11.0"

[tool.poetry.group.dev.dependencies]
# Code quality and formatting
pre-commit = "^3.6.2"
ruff = "^0.8.4"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.6.0"
dotenv-linter = "^0.7"

# Testing
pytest = "^8.4.2"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

# Development database
aiosqlite = "^0.21.0"
pytest-django = "^4.11.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-postgresql = "^6.0.0"
aiosqlite = "^0.21.0"
httpx = {extras = ["testing"], version = "^0.28.1"}


[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["backend/tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "backend/tests/",
    "backend/alembic/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "D"]
ignore = [
    "A005",   # allow to shadow stdlib and builtin module names
    "COM812", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "D100",
    "D101",
    "D102",
    "D104",
    "D106",
    "D203",
    "D212",
    "D401",
    "D404",
    "D405",
    "ISC001",  # implicit string concat conflicts with `ruff format`
    "ISC003",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "PLR2004", # do not report magic numbers
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "TRY003",  # long exception messages from `tryceratops`
]

# Plugin configs:
flake8-quotes.inline-quotes = "single"


[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["D101", "E501", "RUF012"]
"backend/projects/migrations/0004_rename_projects_pr_is_publ_27cef9_idx_prj_pub_slug_idx_and_more.py" = ["Q000"]
"tests/*.py" = ["S101"]
"*/models.py" = ["D105"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = false
exclude = ["backend/projects/migrations/0004_rename_projects_pr_is_publ_27cef9_idx_prj_pub_slug_idx_and_more.py"]


[tool.ruff.lint.pydocstyle]
convention = "google"

# Coverage
[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/settings/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

